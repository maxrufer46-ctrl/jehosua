name: Build Mercados Jehosua APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Preparar APK final
        run: cp app/build/outputs/apk/debug/app-debug.apk Mercados-Jehosua.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Mercados-Jehosua-APK
          path: Mercados-Jehosua.apk
          if-no-files-found: error

      - name: Publicar APK descargable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest Mercados-Jehosua.apk \
            --target "$GITHUB_SHA" \
            --title "Mercados Jehosua APK" \
            --notes "Aplicación Android de Mercados Jehosua." \
            --latest
