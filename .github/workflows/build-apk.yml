name: Build Mercados Jehosua Offline V3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar catálogo e imágenes internas
        run: python3 tools/prepare_offline.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK limpia
        run: gradle --no-daemon :app:assembleDebug

      - name: Preparar archivo final
        run: cp app/build/outputs/apk/debug/app-debug.apk Mercados-Jehosua-Offline-V3.apk

      - name: Validar APK
        run: |
          unzip -t Mercados-Jehosua-Offline-V3.apk >/dev/null
          test $(unzip -l Mercados-Jehosua-Offline-V3.apk | grep -c 'assets/www/assets/products/.*webp') -ge 800

      - uses: actions/upload-artifact@v4
        with:
          name: Mercados-Jehosua-Offline-V3
          path: Mercados-Jehosua-Offline-V3.apk
          if-no-files-found: error

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete offline-v3 --cleanup-tag -y || true
          gh release create offline-v3 Mercados-Jehosua-Offline-V3.apk \
            --target "$GITHUB_SHA" \
            --title "Mercados Jehosua Offline V3" \
            --notes "APK compilada directamente por Gradle, con catálogo e imágenes internas y sin dependencia de Netlify." \
            --latest
