plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mercadosjehosua.offline'
    compileSdk 35

    defaultConfig {
        applicationId "com.mercadosjehosua.app"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1.0"

        buildConfigField 'String', 'MJ_BASE_URL', '"https://leafy-narwhal-7889dd.netlify.app/"'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}
