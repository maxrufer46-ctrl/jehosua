plugins { id 'com.android.application' }

android {
    namespace 'com.mercadosjehosua.offline'
    compileSdk 35

    defaultConfig {
        applicationId "com.mercadosjehosua.offline"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
